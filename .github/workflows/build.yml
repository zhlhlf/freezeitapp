name: Build APK

# push              -> 只做测试编译（assembleRelease，含混淆），产出 artifact，不发布
# workflow_dispatch -> 测试编译 + 建 GitHub Release（手动触发）
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:
    inputs:
      release:
        description: '编译完成后创建 GitHub Release'
        type: boolean
        default: true
      prerelease:
        description: '标记为 pre-release'
        type: boolean
        default: true

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 编译（两种触发都跑）
  build:
    name: 编译 Release APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      version_code: ${{ steps.ver.outputs.version_code }}
      apk_name: ${{ steps.ver.outputs.apk_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 读取 APP 版本
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          VC="$(sed -n 's/.*versionCode[[:space:]]*\([0-9]\+\).*/\1/p' app/build.gradle | head -1)"
          [[ -n "$VERSION" && -n "$VC" ]] || { echo "::error::无法从 app/build.gradle 解析版本"; exit 1; }
          {
            echo "version=$VERSION"
            echo "version_code=$VC"
            echo "apk_name=freezeit_v${VERSION}_release.apk"
          } >> "$GITHUB_OUTPUT"
          echo "APP $VERSION ($VC)"

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像自带 Android SDK；不用 android-actions/setup-android
      # （它会在新镜像上执行 sdkmanager tools 并报 "Failed to find package 'tools'"）
      - name: 安装 SDK 平台与构建工具
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKM" || { echo "::error::找不到 sdkmanager"; exit 1; }
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"
          yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" --install "platforms;android-34" "build-tools;34.0.0"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: 校验 APK
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release/${{ steps.ver.outputs.apk_name }}"
          test -f "$OUT" || { echo "::error::缺少产物 $OUT"; ls -R app/build/outputs/apk || true; exit 1; }
          ls -la app/build/outputs/apk/release/
          # 验签（CI 用仓库内 keystore，密码见 freezeitapp_key_about.txt）
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$OUT"
          "$BT/aapt2" dump badging "$OUT" | grep -E 'package:|sdkVersion|targetSdkVersion' || true

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk_name }}
          path: app/build/outputs/apk/release/${{ steps.ver.outputs.apk_name }}
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布（仅手动触发）
  release:
    name: 创建 Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载 artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.apk_name }}
          path: dist

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ARGS=(--title "冻它APP ${VERSION}" --notes "配套模块使用的冻它 APP ${VERSION}（versionCode ${{ needs.build.outputs.version_code }}）。")
          [ "$PRERELEASE" = "true" ] && ARGS+=(--prerelease)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$APK_NAME" --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "dist/$APK_NAME" "${ARGS[@]}" -R "$GITHUB_REPOSITORY"
          fi
          gh release view "$TAG" -R "$GITHUB_REPOSITORY"
